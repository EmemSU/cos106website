<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="acaplan.html">Planner</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-box">
            <h1>Contact Me</h1>
            <p>Have a question or want to work together? Send me a message below.</p>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Digits only (e.g. 08012345678)">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>

                <!-- Feedback message shown by JavaScript -->
                <p id="formFeedback"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ememobong Umoh. All Rights Reserved.</p>
    </footer>

    <script src="js/contactform.js"></script>
</body>
</html>
