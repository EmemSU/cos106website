<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Academic Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="acaplan.html" class="active">Planner</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="planner-box">
            <h1>Academic Planner</h1>
            <p>Add your assignments, study goals, or deadlines below.</p>

            <!-- Input Area -->
            <form id="taskForm" class="task-input-row">
                <input type="text" id="taskInput" placeholder="e.g. Submit COS 106 Project...">
                <button type="submit" class="add-btn">Add</button>
            </form>

            <!-- Dynamic Task List -->
            <ul id="taskList" class="task-list"></ul>
            <p id="emptyMessage" class="empty-msg">No tasks yet. Add one above!</p>
        </section>
    </main>

    </footer>
